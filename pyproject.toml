[project]
name = "eatventure-bot"
version = "0.1.0"
description = "Eatventure automation bot for Windows"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "opencv-python>=4.10,<5",
    "numpy>=2.1,<3",
    "pillow>=11,<13",
    "pywin32>=308; sys_platform == 'win32'",
    "pynput>=1.8,<2; sys_platform == 'win32'",
    "requests>=2.32,<3",
    "torch>=2.6,<3",
    "gymnasium>=1.0,<2",
    "sb3-contrib>=2.6,<3",
    "rapidocr-onnxruntime>=1.4,<2",
    "onnxruntime>=1.20,<2",
    "tensorboard>=2.19,<3",
    "pytest>=8,<10",
]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
